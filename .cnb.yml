# 将下面的 imports 地址替换为您在 CNB 创建的密钥仓库文件地址。
# 部署密钥与抓取密钥分文件保存，不要将变量值提交到本仓库。
main:
  push:
    - name: test-build-and-deploy-edgeone
      runner:
        tags: cnb:arch:amd64
        cpus: 2
      docker:
        image: node:22-bookworm
      imports: https://cnb.cool/REPLACE_WITH_YOUR_SECRET_REPO/-/blob/main/reits-deploy.env.yml
      stages:
        - name: test-and-build
          script: npm ci && npm test && npm run build
          timeout: 2h
        - name: deploy-edgeone
          script: npx edgeone pages deploy -n "$EDGEONE_PROJECT_NAME" -t "$EDGEONE_API_TOKEN"
          timeout: 2h

  "crontab: 0 9 * * *":
    - name: scheduled-reits-refresh
      runner:
        tags: cnb:arch:amd64
        cpus: 2
      docker:
        image: node:22-bookworm
      imports: https://cnb.cool/REPLACE_WITH_YOUR_SECRET_REPO/-/blob/main/reits-refresh.env.yml
      stages:
        - name: refresh-at-09-00-asia-shanghai
          script: npm ci && npm run refresh
          timeout: 2h

  api_trigger_manual_refresh:
    - name: administrator-manual-reits-refresh
      runner:
        tags: cnb:arch:amd64
        cpus: 2
      docker:
        image: node:22-bookworm
      imports: https://cnb.cool/REPLACE_WITH_YOUR_SECRET_REPO/-/blob/main/reits-refresh.env.yml
      stages:
        - name: run-manual-refresh
          script: npm ci && npm run refresh -- --manual
          timeout: 2h
